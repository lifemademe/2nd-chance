<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Terrain</title>
  </head>
  <body>
    <div id="start-menu" class="start-menu">
      <div class="start-panel">
        <img class="start-icon" src="/images/THUMBNAIL%20copy.png" alt="" />
        <p class="eyebrow">2nd Chance</p>
        <h1>Match, swap, and clear a route.</h1>
        <button id="start-button" type="button">Start</button>
      </div>
    </div>
    <div id="game-over-menu" class="start-menu hidden">
      <div class="start-panel">
        <img class="start-icon" src="/images/THUMBNAIL%20copy.png" alt="" />
        <p class="eyebrow">Game Over</p>
        <h1>No chances left.</h1>
        <button id="restart-button" type="button">Restart</button>
      </div>
    </div>
    <div id="root"></div>
    <div id="level-counter" class="level-counter">Level 1</div>
    <div id="lives-counter" class="level-counter lives-counter">Lives 2</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
